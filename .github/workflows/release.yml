name: MSVC C++ Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Enable MSVC Command Prompt Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Compile Windows Resources (rc.exe)
      run: |
        rc resource.rc

    - name: Compile and Link C++ App (cl.exe)
      run: |
        cl /O2 /GL /Gy /MD /DNDEBUG main.cpp /link /SUBSYSTEM:WINDOWS /LTCG /OPT:REF /OPT:ICF USER32.LIB GDI32.LIB GDIPLUS.LIB WINMM.LIB /OUT:IQ.exe

    - name: Create Official GitHub Release and Upload EXE
      uses: softprops/action-gh-release@v2
      with:
        files: IQ.exe
        name: Release ${{ github.ref_name }}
        tag_name: ${{ github.ref }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
