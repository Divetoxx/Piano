name: G++ C++ Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Compile Windows Resources (windres)
      run: |
        windres resource.rc -o resource.o

    - name: Compile and Link C++ App (g++)
      run: |
        g++ -O3 -finput-charset=UTF-8 -fexec-charset=UTF-8 main.cpp resource.o -o Piano.exe -lgdi32 -luser32 -lgdiplus -lwinmm -static -mwindows

    - name: Strip Debug Symbols (strip)
      run: |
        strip Piano.exe

    - name: Create Official GitHub Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.MY_RELEASE_PAT }}
        name: Piano ${{ github.ref_name }}
        tag_name: ${{ github.ref }}
        files: Piano.exe
        body: |
          <img src="Piano.png" width="702">
          # 🎹 Piano MIDI Synthesizer & Player
          Welcome to the official release of **Piano** — a lightweight, standalone virtual piano and audio synthesizer for Windows.
          
          ## 🚀 Features in this release:
          * **International Support:** Multi-language interface with 14 languages selectable on-the-fly (including custom GDI+ vector flags).
          * **Classic Masterpieces Built-in:** Includes 18 iconic melodies (Shostakovich, Mozart, Bach, Rybnikov's "Munchhausen", Legrand's "The Umbrellas of Cherbourg", and more).
          
          ## 🎮 How to control:
          * Use the **LEFT mouse button** to switch vector flags and browse melodies.
          * The big PLAY NOTE button can be triggered by either clicking your LEFT mouse button or pressing the SPACE bar.
