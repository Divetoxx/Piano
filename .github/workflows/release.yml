name: MSVC C++ Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Enable MSVC Command Prompt Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Compile Windows Resources (rc.exe)
      run: |
        rc resource.rc

    - name: Compile and Link C++ App (cl.exe)
      run: |
        cl /O2 /MT main.cpp resource.res /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib gdiplus.lib /OUT:IQ.exe

    - name: Upload Finished IQ.exe File
      uses: actions/upload-artifact@v4
      with:
        name: Finished-IQ-Test
        path: IQ.exe